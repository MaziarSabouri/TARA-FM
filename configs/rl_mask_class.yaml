# RL fine-tuning of mask+class FM (self-distill objective).
# Set REWARD_TYPE=prob|focal|utility and CLASSIFIER_REWARD_CKPT before training.
model_args:
  spatial_dims: 2
  in_channels: 1
  out_channels: 1
  num_res_blocks: [2, 2, 2, 2]
  num_channels: [64, 128, 256, 512]
  attention_levels: [False, False, True, True]
  norm_num_groups: 32
  resblock_updown: True
  num_head_channels: [64, 128, 256, 512]
  transformer_num_layers: 8
  use_flash_attention: true
  with_conditioning: true
  mask_conditioning: true
  cross_attention_dim: 4
  conditioning_embedding_in_channels: "auto"
  conditioning_embedding_num_channels: [32]

data_args:
  pickle_path: "./data/train_data_128.pkl"
  split_train: "train"
  split_val: "valid"
  mask_num_classes: "auto"

fm_train_args:
  num_epochs: 200
  batch_size: 4
  gradient_accumulation_steps: 64
  lr: 0.0001
  val_freq: 5
  device: "cuda"
  num_val_samples: 12
  fid_num_samples: 32
  checkpoint_dir: checkpoints/fm
  num_workers: 4
  pin_memory: true

rl_train_args:
  num_epochs: 80
  max_updates: 10000
  batch_size: 1
  lr: 0.00001
  val_freq: 5
  num_val_samples: 4
  fid_num_samples: 8
  checkpoint_dir: checkpoints/rl
  num_workers: 4
  pin_memory: true
  objective: "self_distill"
  group_size: 4
  reward_topk: 2
  reward_floor: null
  real_anchor_weight: 0.3
  reward_temperature: 0.5
  adv_alpha: null
  weight_clip: 5.0
  ref_reg_weight: 0.05
  grad_clip_norm: 1.0
  num_inference_steps: 10
  ckpt_every_n_steps: 2000
  gradient_accumulation_steps: 1

solver_args:
  method: "euler"
  step_size: 0.1
  time_points: 10
